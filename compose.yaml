services:
  web:
    image: ghcr.io/smorphet93/swarm-test:latest
    ports:
      - "8100:3000"
    deploy:
      replicas: 3
      restart_policy:
        condition: any
      update_config:
        parallelism: 1
        order: start-first
    logging:
      options:
        max-file: "5"
        max-size: "10m"
    environment:
      DEBUG: "false"
      SECRET: "${SECRET}"
      test_value: "${test_value}"
