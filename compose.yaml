services:
  web:
    image: ghcr.io/smorphet93/swarm-test-web:0.0.1
    ports:
      - "8100:3000"
    deploy:
      replicas: 3
      restart_policy:
        condition: any
      update_config:
        parallelism: 1
        order: start-first
    logging:
      options:
        max-file: "5"
        max-size: "10m"
