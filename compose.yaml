services:
  web:
    image: ghcr.io/smorphet93/swarm-test:latest
    ports:
      - "8100:3000"
    deploy:
      replicas: 3
      restart_policy:
        condition: any
      update_config:
        parallelism: 1
        order: start-first
    logging:
      options:
        max-file: "5"
        max-size: "10m"
    configs:
      - source: wappler_global_config
        target: /opt/node_app/app/config/config.json
configs:
  wappler_global_config:
    content: |
      {
        "debug": "${DEBUG}",
        "secret": "${SECRET}",
        "env": {
          "test_value": "${test_value}"
        }
      }
